# Local dev:  docker compose up -d db
# Full stack: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 2s
      retries: 15

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles: [full]
    environment:
      DATABASE_URL: postgres://todo:todo@db:5432/todo
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,app://bundle}
    ports:
      - "${SERVER_PORT:-3100}:3000"
    healthcheck:
      # Any non-5xx response (401 without a token) means the API is up.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/todos').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 15
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
